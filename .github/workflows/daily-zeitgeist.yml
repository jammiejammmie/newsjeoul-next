name: Daily Zeitgeist (새벽, 10:50 KST)

# 2026-07-26: Netlify 자체 schedule 제거(네이티브 cron 전체 장애, 7/22 22:44 KST 이후) —
# GitHub Actions를 유일한 트리거로 전환. 02시대 Insight 배치(refresh-relationships 등)보다
# 먼저 돌도록 시각을 유지한다.
# 2026-08-04: schedule 제거 — Supabase pg_cron(nj-daily-zeitgeist)으로 이관.
# 근거: 일 1회라 지연 영향은 작지만 스케줄러를 한 곳으로 모은다
# GitHub Actions 스케줄이 저장소 전체에서 밀리는 것을 실측 확인했고(주기가 짧을수록 심함),
# pg_cron 전환 후 정시 실행을 실측 검증했다(update-topic-weight: 08:05·09:05 정확히 60분 간격).
# workflow_dispatch는 남긴다 — 수동 실행과 pg_cron 장애 시 긴급 경로.
# 원복: 아래 블록을 on: 안에 되살리고  select ops.deactivate_phase(5);  실행
#   schedule:
#   - cron: '50 1 * * *'   # 01:50 UTC = 10:50 KST
on:
  workflow_dispatch:

jobs:
  zeitgeist:
    runs-on: ubuntu-latest
    steps:
      - name: Call generate-zeitgeist-background Netlify function
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/generate-zeitgeist-background")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "generate-zeitgeist-background → HTTP $HTTP_CODE"
          echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || exit 1
