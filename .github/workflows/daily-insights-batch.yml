name: Daily Insights Batch (새벽, 11:00 KST)

# 2026-07-26: Netlify 자체 schedule 제거(네이티브 cron 전체 장애, 7/22 22:44 KST 이후) —
# GitHub Actions를 유일한 트리거로 전환. 원래 순서(refresh-relationships → generate-insights →
# generate-node-insights)와 15분 간격을 그대로 유지한다.
on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 11:00 KST
  workflow_dispatch:

jobs:
  insights-batch:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Refresh Relationships (refresh-relationships)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/refresh-relationships")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "refresh-relationships → HTTP $HTTP_CODE"
          echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || exit 1

      - name: 대기 (15분)
        run: sleep 900

      - name: 2. Generate Insights (generate-insights)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/generate-insights")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "generate-insights → HTTP $HTTP_CODE"
          echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || exit 1

      - name: 대기 (15분)
        run: sleep 900

      # 2026-08-03: 동기 함수 26초 캡 초과(504)로 계속 실패하던 것을 Background Function으로
      # 전환했다. Background는 즉시 202를 반환하고 실제 처리는 백그라운드에서 계속되므로,
      # 이 스텝은 "정상 접수"까지만 확인한다 — 실제 처리 결과는 Netlify 함수 로그로 확인해야 한다.
      - name: 3. Generate Node Insights (generate-node-insights-background)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/generate-node-insights-background")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "generate-node-insights-background → HTTP $HTTP_CODE (202면 정상 접수)"
          echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || exit 1
