name: Weekly Evolution Report (월요일, 09:00 KST)

# 마스터 스펙 v1 Track 2(Evolution Engine). 갭 감지(2-1)와 자기 감시 리포트(2-3)를 매주
# 월요일에 실행한다. 두 함수 다 동기 함수(26초 캡 이내) — Background 전환 불필요할 만큼
# 가볍지만, Claude 호출(갭 감지)이 있어 여유를 두고 배경 함수로 작성함(파일명 -background).
on:
  schedule:
    - cron: '0 0 * * 1'   # 00:00 UTC 월요일 = 09:00 KST 월요일
  workflow_dispatch:

jobs:
  evolution-report:
    runs-on: ubuntu-latest
    steps:
      - name: Call detect-coverage-gaps-background
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/detect-coverage-gaps-background")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "detect-coverage-gaps-background → HTTP $HTTP_CODE"
          echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || exit 1

      - name: Call generate-weekly-report-background
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/generate-weekly-report-background")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "generate-weekly-report-background → HTTP $HTTP_CODE"
          echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || exit 1
