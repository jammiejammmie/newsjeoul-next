name: Scan Threads Comments (Shadow Mode, hourly)

# 마스터 스펙 v1 Track 3-2. 실제 댓글 게시 없음 — comment_auto_reply_log에 분류+답변 초안만
# 기록한다(scan-comments-shadow-background.js 상단 주석 참고). Threads 포스팅 주기(post-threads.yml)
# 와 겹치지 않게 30분 오프셋.
# 2026-08-04: schedule 제거 — Supabase pg_cron(nj-scan-comments, '30 * * * *')으로 이관.
# 근거: GitHub Actions가 60분 설정 대비 실측 평균 143분(2.4배)으로 밀어냈다.
# workflow_dispatch는 남긴다 — 수동 실행·pg_cron 장애 시 긴급 경로.
# 원복하려면 아래를 되살리고 select ops.deactivate_phase(2); 를 실행한다:
#   schedule:
#     - cron: '30 * * * *'   # 매시 30분(UTC)
on:
  workflow_dispatch:

jobs:
  scan-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Call scan-comments-shadow-background Netlify function
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/scan-comments-shadow-background")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "scan-comments-shadow-background → HTTP $HTTP_CODE"
          echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || exit 1
