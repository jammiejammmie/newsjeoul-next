name: Daily News/Election Update (저녁, 21:00 KST)

# 2026-07-26: Netlify 자체 schedule 제거(네이티브 cron 전체 장애, 7/22 22:44 KST 이후) —
# GitHub Actions를 유일한 트리거로 전환.
on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC = 21:00 KST
  workflow_dispatch:

jobs:
  evening-update:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Update News Evening (update-news-evening)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/update-news-evening")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "update-news-evening → HTTP $HTTP_CODE"
          echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || exit 1

      - name: 2. Update Elections Evening (update-elections-evening)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/update-elections-evening")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "update-elections-evening → HTTP $HTTP_CODE"
          echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || exit 1
