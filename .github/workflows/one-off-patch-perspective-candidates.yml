name: 1회성 — perspective_candidates 패치 (2026-07-31)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: patch-perspective-candidates 호출
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/patch-perspective-candidates")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "patch-perspective-candidates → HTTP $HTTP_CODE"
          echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || exit 1
