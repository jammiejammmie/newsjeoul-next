name: Post to Threads (hourly, up to 3/run)

# 2026-07-19: 하루 1회 → 매시 정각으로 변경(PM 지시 "웹 생산량에 비례하는 Threads 생산량",
# 시간 분산 발행). 후보가 없거나 품질 기준 미달, 이미 게시된 Topic인 경우 함수가 정상
# Skip으로 처리하므로 매시간 시도해도 무해하다(평생 1회 게시 원칙은 topics.ai_context.threads로
# 보장).
#
# 2026-07-22: PM 지시로 1회 실행당 최대 3건(게시 사이 2~5분 간격)까지 게시하도록 확대 —
# 26초 동기 함수 하드캡을 넘기므로 함수를 post-threads-background.js(Background Function)로
# 전환했다. Background Function은 호출 즉시 202를 반환하고 실제 처리는 백그라운드에서 계속되므로,
# 이 워크플로는 "정상적으로 접수됐는지"만 확인할 뿐 실제 게시 결과(성공 건수 등)는 확인할 수
# 없다 — 결과 확인은 Netlify 함수 로그 또는 Supabase 조회로 별도 수행해야 한다.
#
# 시간 분산(PM 지시): 정각 클러스터링을 피하기 위해 0~14분 랜덤 지연을 둔다.
on:
  schedule:
    - cron: '0 * * * *'   # 매시 정각(UTC) 트리거, 실제 호출은 아래 지연 이후
  workflow_dispatch:        # 수동 실행 가능 (테스트용)

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay (0-14 min) to avoid on-the-hour clustering
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 900))

      - name: Call post-threads-background Netlify function
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/post-threads-background")
          echo "HTTP Status: $HTTP_CODE (Background Function — 202면 정상 접수, 실제 게시 결과는 별도 확인 필요)"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "Function returned $HTTP_CODE — failing job"
            exit 1
          fi
