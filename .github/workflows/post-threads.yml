name: Post to Threads (every 30min, up to 4/run)

# 2026-07-19: 하루 1회 → 매시 정각으로 변경(PM 지시 "웹 생산량에 비례하는 Threads 생산량",
# 시간 분산 발행). 후보가 없거나 품질 기준 미달, 이미 게시된 Topic인 경우 함수가 정상
# Skip으로 처리하므로 매시간 시도해도 무해하다(평생 1회 게시 원칙은 topics.ai_context.threads로
# 보장).
#
# 2026-07-22: PM 지시로 1회 실행당 최대 3건(게시 사이 2~5분 간격)까지 게시하도록 확대 —
# 26초 동기 함수 하드캡을 넘기므로 함수를 post-threads-background.js(Background Function)로
# 전환했다. Background Function은 호출 즉시 202를 반환하고 실제 처리는 백그라운드에서 계속되므로,
# 이 워크플로는 "정상적으로 접수됐는지"만 확인할 뿐 실제 게시 결과(성공 건수 등)는 확인할 수
# 없다 — 결과 확인은 Netlify 함수 로그 또는 Supabase 조회로 별도 수행해야 한다.
#
# 시간 분산(PM 지시): 정각 클러스터링을 피하기 위해 랜덤 지연을 둔다.
#
# 2026-08-03: PM 지시로 배급 밀도 상향 — 1시간 → 30분 주기, 1회 최대 3건 → 4건.
# 계기: distribution_run_log 실측에서 정시 실행이 실제로는 매시간 붙지 않는 것을 확인했다
# (15:26 실행 후 16시대가 통째로 누락되고 17:44에 붙음). GitHub Actions 스케줄은 지연·누락이
# 흔한데, 기존 설계는 "시간당 1회 × 3건"을 전제로 하루 목표(47~54건)를 나누고 있어서
# 실행이 빠질 때마다 그만큼 구조적으로 목표에 도달할 수 없었다. 주기를 30분으로 좁히면
# 누락 한 번의 손실이 절반으로 줄고, 상한 4건은 밀린 몫을 따라잡을 여유를 준다.
#
# 랜덤 지연을 0~14분에서 0~9분으로 줄인 이유: 30분 주기에서 14분 지연은 슬롯의 절반이라
# 인접 실행 간 간격이 16분까지 붙어버린다. 0~9분이면 분산 목적은 유지하면서 간격이
# 21분 이상으로 유지된다(1회 실행 최대 소요 약 10분이므로 겹치지 않는다).
#
# 주의: 아래 cron 주기를 바꾸면 post-threads-background.js의 RUNS_PER_HOUR도 같이 바꿔야 한다.
# 그 값이 "남은 목표 ÷ 남은 실행 기회" 계산의 분모라서, 어긋나면 하루 배급 페이스가 틀어진다.
# 2026-08-04: schedule 제거 — Supabase pg_cron(nj-post-threads)으로 이관.
# 근거: 30분 설정 → 실측 평균 94분(3.1배)
# GitHub Actions 스케줄이 저장소 전체에서 밀리는 것을 실측 확인했고(주기가 짧을수록 심함),
# pg_cron 전환 후 정시 실행을 실측 검증했다(update-topic-weight: 08:05·09:05 정확히 60분 간격).
# workflow_dispatch는 남긴다 — 수동 실행과 pg_cron 장애 시 긴급 경로.
# 원복: 아래 블록을 on: 안에 되살리고  select ops.deactivate_phase(3);  실행
#   schedule:
#   - cron: '*/30 * * * *'   # 30분마다(UTC) 트리거, 실제 호출은 아래 지연 이후
on:
  workflow_dispatch:         # 수동 실행 가능 (테스트용)

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay (0-9 min) to avoid on-the-slot clustering
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 540))

      # 2026-08-17: 인스타그램은 이 함수 말미에서 함께 호출된다(post-threads-background.js).
      # 별도 스텝을 두지 않는 이유: 실제 운영 트리거는 GitHub Actions가 아니라 Supabase
      # pg_cron(nj-post-threads)이라, 여기에만 스텝을 추가하면 수동 실행 때만 인스타가 도는
      # 반쪽짜리가 된다. 함수 안에서 부르면 트리거가 무엇이든 두 채널이 항상 같이 돈다.
      - name: Call post-threads-background Netlify function (Threads + Instagram)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "x-admin-key: ${{ secrets.NEWSJEOUL_ADMIN_KEY }}" \
            "https://newsjeoul.co.kr/.netlify/functions/post-threads-background")
          echo "HTTP Status: $HTTP_CODE (Background Function — 202면 정상 접수, 실제 게시 결과는 별도 확인 필요)"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "Function returned $HTTP_CODE — failing job"
            exit 1
          fi
