<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img"><title>소득 기준과 세대원 특성 기준을 모두 확인하는 신청 판단 흐름</title><style>@font-face{font-family:P;src:url(data:font/woff2;base64,)}text{font-family:P,sans-serif;fill:#123f39;font-size:23px}.sm{font-size:20px;fill:#48665f}.bold{font-size:29px;font-weight:bold}.white{fill:white}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#297769" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="22" fill="#f2f6f1"/>
<text x="32" y="47" class="bold">두 기준을 모두 통과해야 합니다</text>
<rect x="32" y="82" width="536" height="112" rx="16" fill="white" stroke="#c5d8d0"/><text x="54" y="120">① 생계·의료·주거·교육급여 수급</text><text x="54" y="158" class="sm">일반 에너지바우처의 소득 기준</text>
<path d="M300 197V245" stroke="#297769" stroke-width="3" marker-end="url(#arr)"/>
<rect x="32" y="253" width="536" height="127" rx="16" fill="white" stroke="#c5d8d0"/><text x="54" y="294">② 같은 등본의 세대원 특성</text><text x="54" y="332" class="sm">노인·영유아·장애인 등 해당 기준</text><text x="54" y="361" class="sm">본문의 나이·법정 요건까지 확인</text>
<path d="M300 384V430" stroke="#297769" stroke-width="3" marker-end="url(#arr)"/>
<rect x="32" y="438" width="536" height="82" rx="16" fill="#145d50"/><text x="300" y="489" text-anchor="middle" class="white">제외·중복 제한 확인 → 신청·심사</text>
<text x="32" y="566" class="sm">수급자이거나 다자녀라는 이유 하나로 확정 불가</text>
</svg>