<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650"><rect width="600" height="650" rx="24" fill="#eff4f3"/><defs><style>@font-face{font-family:Diagram;src:url(data:font/woff2;base64,) format("woff2");}</style></defs><g font-family="Diagram,sans-serif" fill="#183d3b"><text x="28" y="56" font-size="30">A210C, 두 화면을 구분하세요</text><rect x="24" y="90" width="552" height="150" rx="16" fill="white"/><text x="42" y="130" font-size="29">본체의 작은 상태 화면</text><text x="42" y="174" font-size="26">충전 전력·전송 상태를 표시</text><text x="42" y="212" font-size="26">UI는 영어 · 한국어 미지원</text><rect x="24" y="265" width="552" height="150" rx="16" fill="white"/><text x="42" y="305" font-size="29">외부 모니터의 주사율</text><text x="42" y="349" font-size="26">2K 최대 240Hz 등 출력 조건</text><text x="42" y="387" font-size="26">PC·케이블·화면 조건 확인</text><rect x="24" y="440" width="552" height="150" rx="16" fill="white"/><text x="42" y="480" font-size="29">맥 외부 두 화면의 내용</text><text x="42" y="524" font-size="26">같은 내용 표시 조건</text><text x="42" y="562" font-size="26">각각 다른 내용 확장과 구분</text></g></svg>