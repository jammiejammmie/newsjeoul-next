<svg xmlns="http://www.w3.org/2000/svg" width="600" height="880" viewBox="0 0 600 880"><rect width="600" height="880" rx="24" fill="#f0f5fa"/><g font-family="sans-serif" fill="#18334d"><text x="28" y="58" font-size="30">100W 입력 ≠ 노트북에 100W</text><rect x="24" y="90" width="552" height="166" rx="16" fill="white" stroke="#7798b7"/><text x="42" y="134" font-size="30">① 최대 입력 100W</text><text x="42" y="182" font-size="27">충전기 → 해당 허브</text><text x="42" y="222" font-size="27">Anker 10-in-1 FAQ 예시</text><rect x="24" y="280" width="552" height="166" rx="16" fill="white" stroke="#7798b7"/><text x="42" y="324" font-size="30">② 허브 소비 15W 고려</text><text x="42" y="372" font-size="27">모든 허브에서 15W를</text><text x="42" y="412" font-size="27">일괄 빼는 공식이 아닙니다</text><rect x="24" y="470" width="552" height="166" rx="16" fill="white" stroke="#7798b7"/><text x="42" y="514" font-size="30">③ 전달 최대 85W</text><text x="42" y="562" font-size="27">실제 충전은 기기·케이블</text><text x="42" y="602" font-size="27">충전기 조건에 따라 달라짐</text><rect x="24" y="660" width="552" height="166" rx="16" fill="white" stroke="#7798b7"/><text x="42" y="704" font-size="30">광고 상품의 사양 아님</text><text x="42" y="752" font-size="27">특정 제품의 공식 안내 정리</text><text x="42" y="792" font-size="27">실측 결과가 아닙니다</text></g></svg>