<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620"><rect width="600" height="620" rx="22" fill="#edf2ee"/><defs><style>@font-face{font-family:Diagram;src:url(data:font/woff2;base64,) format("woff2");}</style></defs><g font-family="Diagram,sans-serif" fill="#183e39"><text x="28" y="58" font-size="29">소리의 방향부터 구분하세요</text><rect x="24" y="91" width="552" height="204" rx="18" fill="#fffdf7"/><text x="46" y="134" font-size="25">누음 저감</text><text x="46" y="177" font-size="23">내 음악 → 밖에 있는 사람</text><text x="46" y="222" font-size="20">소리가 전혀 새지 않는다는 보장 아님</text><text x="46" y="256" font-size="20">음량·착용·주변 환경에 따라 달라짐</text><rect x="24" y="321" width="552" height="181" rx="18" fill="#fffdf7"/><text x="46" y="366" font-size="25">외부 소음 제어</text><text x="46" y="410" font-size="23">주변 소음 → 내가 듣는 소리</text><text x="46" y="456" font-size="20">같은 기능·같은 구매 목적이 아닙니다</text><text x="28" y="556" font-size="21">도서관: 옆 사람에게 들리는 정도</text><text x="28" y="590" font-size="21">출퇴근: 내가 내용을 알아듣는 정도</text></g></svg>