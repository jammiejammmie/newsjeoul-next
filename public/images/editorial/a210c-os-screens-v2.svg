<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-label="A210C 외부 모니터 두 대의 운영체제별 화면 구성"><title>A210C 외부 모니터 두 대의 운영체제별 화면 구성</title><desc>외부 모니터 두 대가 macOS에서는 A와 A, Windows의 지원 조건에서는 A와 B를 표시하는 예시. 실제 화면 수나 특정 노트북의 호환 보증이 아님.</desc><defs><style>@font-face{font-family:P;src:url(data:font/woff2;base64,)}text{font-family:P,sans-serif;fill:#173532}.small{font-size:26px}.label{font-size:28px}.big{font-size:32px;font-weight:700}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#008774" stroke-width="2"/></marker></defs><rect width="720" height="660" rx="24" fill="#eef5f1"/><text x="40" y="55" class="big">단자 두 개가 확장 두 화면은 아닙니다</text>
