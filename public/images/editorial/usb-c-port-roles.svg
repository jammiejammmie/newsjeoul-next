<svg xmlns="http://www.w3.org/2000/svg" width="600" height="880" viewBox="0 0 600 880"><rect width="600" height="880" rx="24" fill="#f0f5fa"/><g font-family="sans-serif" fill="#18334d"><text x="28" y="58" font-size="30">같은 USB-C, 역할은 다릅니다</text><rect x="24" y="90" width="552" height="166" rx="16" fill="white" stroke="#7798b7"/><text x="42" y="134" font-size="30">HOST / PC → 노트북</text><text x="42" y="182" font-size="27">노트북에 연결하는 단자</text><text x="42" y="222" font-size="27">설명서에서 연결 방향 확인</text><rect x="24" y="280" width="552" height="166" rx="16" fill="white" stroke="#7798b7"/><text x="42" y="324" font-size="30">PD IN ← 충전기</text><text x="42" y="372" font-size="27">전원을 받는 단자</text><text x="42" y="412" font-size="27">영상용으로 가정하지 않기</text><rect x="24" y="470" width="552" height="166" rx="16" fill="white" stroke="#7798b7"/><text x="42" y="514" font-size="30">DATA → 저장장치</text><text x="42" y="562" font-size="27">데이터 전송과 영상 지원</text><text x="42" y="602" font-size="27">서로 다른 조건입니다</text><rect x="24" y="660" width="552" height="166" rx="16" fill="white" stroke="#7798b7"/><text x="42" y="704" font-size="30">HDMI / DP → 모니터</text><text x="42" y="752" font-size="27">노트북 쪽 영상 지원도</text><text x="42" y="792" font-size="27">함께 확인해야 합니다</text></g></svg>