<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650"><rect width="600" height="650" rx="24" fill="#eff4f3"/><defs><style>@font-face{font-family:Diagram;src:url(data:font/woff2;base64,) format("woff2");}</style></defs><g font-family="Diagram,sans-serif" fill="#183d3b"><text x="28" y="56" font-size="30">본체 가격만 비교하지 마세요</text><rect x="24" y="90" width="552" height="150" rx="16" fill="white"/><text x="42" y="130" font-size="29">① 허브 구매금액</text><text x="42" y="174" font-size="26">같은 모델·색상·보증 조건</text><text x="42" y="212" font-size="26">일반형과 한정판도 구분</text><rect x="24" y="265" width="552" height="150" rx="16" fill="white"/><text x="42" y="305" font-size="29">② 추가 충전기·케이블</text><text x="42" y="349" font-size="26">기존 부품이 조건을 맞추면</text><text x="42" y="387" font-size="26">그 항목의 추가비용은 0원</text><rect x="24" y="440" width="552" height="150" rx="16" fill="white"/><text x="42" y="480" font-size="29">③ 내가 얻는 편의</text><text x="42" y="524" font-size="26">상태 화면이 필요 없다면</text><text x="42" y="562" font-size="26">현재 허브 유지도 선택입니다</text></g></svg>