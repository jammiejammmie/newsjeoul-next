[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 진단 전용(임시, 2026-07-17) — 원인 확인 후 이 섹션과 diag-schedule-echo.js를 반드시 제거할 것
[functions."diag-schedule-echo"]
  schedule = "*/5 * * * *"

# 파이프라인 정체 자동 감지(2026-07-22, Editorial Plan~Expansion 22시간 정체 사고 이후 도입).
# 20분마다 각 단계 마지막 성공 시각 + Editorial 백로그를 확인해 이상하면 Slack으로 알린다
# (SLACK_WEBHOOK_URL 미설정 시 콘솔 로그만 남기고 조용히 넘어감 — 배포에 지장 없음).
[functions."check-pipeline-health"]
  schedule = "*/20 * * * *"

# 기존 함수들
[functions."fetch-comparisons-kr"]
  timeout = 30

[functions."fetch-election-kr"]
  timeout = 30

[functions."update-news"]
  schedule = "0 0 * * *"
  timeout = 60

[functions."update-news-evening"]
  schedule = "0 12 * * *"
  timeout = 60

[functions."update-elections"]
  schedule = "0 0 * * *"
  timeout = 60

[functions."update-elections-evening"]
  schedule = "0 12 * * *"
  timeout = 60

# 2.0 파이프라인
[functions."collect-news"]
  schedule = "0 */3 * * *"
  timeout = 90 # RSS 수집(~36초) + 원문 URL 해제 시간예산(20초) 여유 확보 위해 60→90 상향(2026-07-11)

[functions."resolve-article-urls"]
  timeout = 90

[functions."enrich-article-images"]
  # 2026-07-19: 자동 schedule 제거 — 이미지 제거·텍스트 중심 개편(PM 지시). 신규 콘텐츠 생산
  # 과정에서 더 이상 이미지 수집을 필수/자동 단계로 두지 않는다. 함수 자체와 og_image_url
  # 데이터는 삭제하지 않고 남겨둔다(과거 데이터 보존, Admin 수동 실행은 계속 가능).
  timeout = 90

[functions."process-stories-background"]
  schedule = "30 */3 * * *" # 2026-07-14: 동기 함수 26초 하드캡에 걸려 502로 실패하는 것을
                            # 실제 재현·확인 후 Background Function으로 전환(Editorial Engine과 동일 패턴)
  timeout = 60

[functions."extract-entities"]
  schedule = "35 */3 * * *"
  timeout = 60

[functions."resolve-topics-background"]
  schedule = "40 */3 * * *" # 2026-07-14: BATCH_SIZE=5로도 27~40초가 걸려 동기 26초 캡을 자주
                            # 넘기는 것을 실제 재현·확인 후 Background Function으로 전환
  timeout = 90

[functions."generate-updates"]
  schedule = "45 */3 * * *"
  timeout = 90

[functions."post-threads-background"]
  # 2026-07-19: 자체 schedule 제거 — GitHub Actions(.github/workflows/post-threads.yml)만을
  # 유일한 트리거로 유지한다(Threads Final Design §1). 이전엔 여기와 GitHub Actions가 같은
  # 시각(0 1 * * *)에 동시 존재해 헤더명 버그가 고쳐지면 이중 게시 위험이 있었다.
  # 2026-07-22: post-threads.js → post-threads-background.js로 전환(PM 지시 — 1회 실행당 최대
  # 3건, 게시 사이 2~5분 간격 요구사항은 26초 동기 함수 하드캡으로 구현 불가능해 Background
  # Function으로 전환). timeout 설정은 Background Function에는 사실상 상한 없음을 의미(최대 15분).

# Editorial Engine (2026-07-11 Phase 2~3, Background Function 전환) — 365일 무인 운영 목표.
# 동기 함수 26초 하드캡을 피하기 위해 -background 접미사로 전환(최대 15분 실행, 응답은 즉시 202).
# timeout 설정은 이 컨텍스트에선 사실상 상한 없음을 의미(플랫폼 기본값을 그대로 둠).
[functions."generate-zeitgeist-background"]
  schedule = "50 1 * * *" # 하루 1회, 02시대 배치(refresh-relationships 등)보다 먼저

[functions."generate-editorial-plan-background"]
  schedule = "50 */3 * * *" # generate-updates(45) 다음 — 3시간 주기

[functions."generate-publish-gate-background"]
  schedule = "52 */3 * * *" # editorial-plan(50) 다음, editorial-draft(55) 이전 — Gate 판정 없이
                            # 장문 생성이 진행되지 않도록 사이에 배치(DEC-006, 2026-07-17)

[functions."generate-editorial-draft-background"]
  schedule = "55 */3 * * *" # editorial-plan(50) 다음 — 계획 수립분을 받아 생성

[functions."generate-expansion-drafts-background"]
  schedule = "56 */3 * * *" # editorial-draft(55) 직후 — Expansion Engine(PM 지시 2026-07-19,
                            # KPI=색인 대상 페이지 수). DEEP_DIVE 외 6종 라우팅 결과에 실제 콘텐츠를
                            # 연결하고, 무게 높은 DEEP_DIVE Topic에는 보너스 앵글(가이드/비교/배경/FAQ)을 추가한다.

[functions."generate-relation-context-background"]
  schedule = "58 */3 * * *" # editorial-draft(55) 직후 — 이번 주기에 새로 published된 Topic의
                            # 관계·엔티티 설명을 바로 채운다(2026-07-12, 운영 검증 통과 후 자동화)

[functions."update-topic-weight-background"]
  # 2026-07-22: 3시간 주기 → 매시 정각으로 상향(PM 지시 — "Hero는 계속 바뀌어야 한다. 사이트가
  # 살아있다는 느낌을 줘야 한다"). 3시간에 한 번만 무게를 재계산하면 그 사이 아무리 중요한 새
  # Topic이 떠도 Hero가 최대 3시간 동안 못 바뀐다 — 매시간으로 좁혀 Hero 반응성을 높인다.
  # BATCH_SIZE=25 기준 하루 24회×25건=600건, 현재 active Topic 수(약 240개)를 하루에 두 번 이상
  # 전부 갱신할 수 있는 여유가 있다. 이 실행 끝에 hero_history 갱신도 함께 일어난다.
  #
  # 2026-07-24: Netlify 자체 schedule 제거 — 실운영 점검 중 이 schedule이 7/22 22:44 KST(수동
  # 복구 스크립트 실행 시점) 이후 51시간 넘게 단 한 번도 실행되지 않은 것을 확인했다(같은 기간
  # GitHub Actions가 curl로 직접 호출하는 다른 함수들은 전부 정상 동작 — Netlify 네이티브 cron만
  # 이 함수에서 안 붙는 것으로 보임). 원인 불명인 채로 Hero가 무한정 고정되는 걸 막기 위해
  # post-threads-background와 동일하게 GitHub Actions(.github/workflows/update-topic-weight.yml)를
  # 유일한 트리거로 전환한다.

# 3.0 Insight/연결 배치 — 비용 최소화 위해 1일 1회만
[functions."refresh-relationships"]
  schedule = "0 2 * * *"
  timeout = 60

[functions."generate-insights"]
  schedule = "15 2 * * *"
  timeout = 60

[functions."generate-node-insights"]
  schedule = "30 2 * * *"
  timeout = 90
