[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 기존 함수들
[functions."fetch-comparisons-kr"]
  timeout = 30

[functions."fetch-election-kr"]
  timeout = 30

[functions."update-news"]
  schedule = "0 0 * * *"
  timeout = 60

[functions."update-news-evening"]
  schedule = "0 12 * * *"
  timeout = 60

[functions."update-elections"]
  schedule = "0 0 * * *"
  timeout = 60

[functions."update-elections-evening"]
  schedule = "0 12 * * *"
  timeout = 60

# 2.0 파이프라인
[functions."collect-news"]
  schedule = "0 */3 * * *"
  timeout = 60

[functions."process-stories"]
  schedule = "30 */3 * * *"
  timeout = 60

[functions."extract-entities"]
  schedule = "35 */3 * * *"
  timeout = 60

[functions."resolve-topics"]
  schedule = "40 */3 * * *"
  timeout = 90

[functions."generate-updates"]
  schedule = "45 */3 * * *"
  timeout = 90

[functions."post-threads"]
  schedule = "0 1 * * *"
  timeout = 90

# 3.0 Insight/연결 배치 — 비용 최소화 위해 1일 1회만
[functions."refresh-relationships"]
  schedule = "0 2 * * *"
  timeout = 60

[functions."generate-insights"]
  schedule = "15 2 * * *"
  timeout = 60

[functions."generate-node-insights"]
  schedule = "30 2 * * *"
  timeout = 90
